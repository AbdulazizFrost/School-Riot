# nginx in front of the site: the public face on ports 80/443 (HTTPS added by certbot), passing requests to
# the site on 127.0.0.1:8080. setup.sh fills in __SERVER_NAME__ (the domain, or _ for "any" when there is none).
limit_req_zone $binary_remote_addr zone=sr_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # videos in bug reports (up to 100 MB in site.config.json) and some room
    client_max_body_size 110m;
    client_body_timeout 120s;
    server_tokens off;

    # the site itself sees the visitor's real address (overwritten, never taken from the visitor's own header)
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # the live chat: one long response per open page, passed through at once
    location = /api/chat/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # bug report files: streamed to the site as they arrive (it checks and limits them itself)
    location /api/bugs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_request_buffering off;
        proxy_read_timeout 15m;
        limit_req zone=sr_api burst=40 nodelay;
    }

    # the game's archive: streamed, not copied to nginx's disk first
    location /download/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=sr_api burst=40 nodelay;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
